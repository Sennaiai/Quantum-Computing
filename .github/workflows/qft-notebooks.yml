name: QFT arithmetic and Shor scientific benchmark
# Scientific execution is scoped to this project's files; manual reruns remain available.
on:
  pull_request:
    paths:
      - "projects/QFT/**"
  push:
    branches: [main]
    paths:
      - "projects/QFT/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "projects/QFT"
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "projects/QFT/requirements.txt"
      - name: Install pinned cross-framework environment
        run: python -m pip install -r requirements.txt
      - name: Execute scientific tests, experiments, and both notebooks
        run: python run_checks.py
      - uses: actions/upload-artifact@v4
        with:
          name: qft-executed-scientific-evidence
          path: projects/QFT/artifacts/validation/
