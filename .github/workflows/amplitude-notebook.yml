name: Amplitude amplification scientific benchmark
# Scientific execution is scoped to this project's files; manual reruns remain available.
on:
  pull_request:
    paths:
      - "projects/Amplitude Amplification/**"
  push:
    branches: [main]
    paths:
      - "projects/Amplitude Amplification/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  amplitude:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "projects/Amplitude Amplification"
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "projects/Amplitude Amplification/requirements.txt"
      - name: Install pinned scientific environment
        run: python -m pip install -r requirements.txt
      - name: Validate physics, measurements, resources, and fresh-kernel notebook
        run: python run_checks.py
      - uses: actions/upload-artifact@v4
        with:
          name: amplitude-scientific-evidence
          path: projects/Amplitude Amplification/artifacts/validation/
