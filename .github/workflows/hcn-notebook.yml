name: HCN scientific benchmark

# Scientific execution is scoped to this project's files; manual reruns remain available.
on:
  pull_request:
    paths:
      - "projects/Quanutm Chemistry /**"
  push:
    branches: [main]
    paths:
      - "projects/Quanutm Chemistry /**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hcn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "projects/Quanutm Chemistry /."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "projects/Quanutm Chemistry /requirements.txt"
      - name: Install benchmark environment
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check notebook discovery after repository moves
        run: python -m unittest -v test_notebook_discovery
      - name: Execute scientific tests and default notebook benchmark
        run: python run_checks.py --study hcn
      - name: Retain executed evidence
        uses: actions/upload-artifact@v4
        with:
          name: hcn-executed-evidence
          path: "projects/Quanutm Chemistry /artifacts/hcn/"
