name: ADMET scientific experiment

on:
  pull_request:
    paths:
      - "projects/Modular_QEML_admet_Pipeline_Senay Kahsay/**"
      - ".github/workflows/admet-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "projects/Modular_QEML_admet_Pipeline_Senay Kahsay/**"
      - ".github/workflows/admet-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "projects/Modular_QEML_admet_Pipeline_Senay Kahsay"
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ADMET_BBB_FILE: "${{ github.workspace }}/projects/Modular_QEML_admet_Pipeline_Senay Kahsay/artifacts/data/bbb_martins.tab"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "projects/Modular_QEML_admet_Pipeline_Senay Kahsay/requirements.txt"
      - name: Install pinned scientific environment
        run: python -m pip install -r requirements.txt
      - name: Acquire and verify the pinned public BBB artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, sys
          sys.path[:0] = ['src', 'python_classes']
          from data_benchmark import download_bbb
          download_bbb(Path(os.environ['ADMET_BBB_FILE']))
          PY
      - name: Run scientific tests and all three fresh-kernel notebooks
        run: python run_checks.py
      - name: Reproduce measured data and quantum-control experiments offline
        run: python run_benchmarks.py --bbb-file "$ADMET_BBB_FILE"
      - name: Retain executed notebooks and benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: admet-executed-scientific-evidence
          path: |
            projects/Modular_QEML_admet_Pipeline_Senay Kahsay/artifacts/validation/
            projects/Modular_QEML_admet_Pipeline_Senay Kahsay/artifacts/benchmarks/benchmark_summary.json
            projects/Modular_QEML_admet_Pipeline_Senay Kahsay/artifacts/benchmarks/manifest.json
            projects/Modular_QEML_admet_Pipeline_Senay Kahsay/artifacts/benchmarks/*.svg
