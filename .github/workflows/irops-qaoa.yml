name: IROPS QAOA circuit benchmark
on:
  pull_request:
    paths:
      - "projects/QUBO IROPS solver/**"
      - "!projects/QUBO IROPS solver/README.md"
  push:
    branches: [main]
    paths:
      - "projects/QUBO IROPS solver/**"
      - "!projects/QUBO IROPS solver/README.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qaoa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "projects/QUBO IROPS solver/qaoa"
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            projects/QUBO IROPS solver/requirements.txt
            projects/QUBO IROPS solver/qaoa/requirements.txt
      - name: Install pinned QAOA environment
        run: python -m pip install -r requirements.txt
      - name: Verify Hamiltonian, adjoint gradients, circuits and matched actual-data experiment
        run: python run_qaoa_checks.py
      - uses: actions/upload-artifact@v4
        with:
          name: irops-qaoa-scientific-evidence
          path: |
            projects/QUBO IROPS solver/qaoa/artifacts/validation/validation_summary.json
            projects/QUBO IROPS solver/qaoa/artifacts/validation/QAOA_IROPS_Neighbourhoods.ipynb
            projects/QUBO IROPS solver/qaoa/artifacts/validation/qaoa_results.json
            projects/QUBO IROPS solver/qaoa/artifacts/validation/qaoa_comparison.svg
            projects/QUBO IROPS solver/qaoa/artifacts/validation/example_qaoa.qasm
